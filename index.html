    <title>Post CRUD</title>
    <style>
        .spinner{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            overflow-x: hidden;
        }

        h4{
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

<body>
    <header>
        <h2 class="text-center bg-info p-2">POST CRUD</h2>
    </header>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-2">
                <div class="card bg-light">
                    <div class="card-body">
                        <form id="postForm">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input required type="text" id="title" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="body">Body</label>
                                <input required type="text" id="body" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="userId">UserId</label>
                                <input required type="number" id="userId" class="form-control">
                            </div>

                    
                        <button type="submit" id="addPostBtn" class="btn btn-sm btn-primary btn-block">Add Post</button>
                        <button type="button" id="updatePostBtn" class="btn btn-sm btn-danger btn-block d-none">Update Post</button>
                    </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="postContainer">

            </div>
